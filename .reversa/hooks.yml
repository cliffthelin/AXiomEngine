# hooks.yml
# Optional hooks executed before or after Reversa forward skills.
#
# Hook Schema:
#   command:     command that will be suggested (optional: true) or required (optional: false)
#   description: short text displayed to the user
#   enabled:     true | false. Defaults to true if missing.
#   optional:    true (shows clickable link) | false (runs automatically and blocks)
#
# Rules:
#   Invalid YAML here is tolerated: the skill proceeds normally, just without hooks.
#   There is no condition DSL in this file. If a hook should not run, set enabled: false.
#
# By default, all hooks start empty. Add only those that make sense for your project.

schema-version: 1

