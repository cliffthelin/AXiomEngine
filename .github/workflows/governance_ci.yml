name: AXiomEngine Governance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Release Verifier
        run: |
          # The Release Verifier is the single source of truth for v1.5.0
          python3 scripts/release_verifier.py --project-root . --json
