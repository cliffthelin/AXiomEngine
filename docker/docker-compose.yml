services:
  n8n:
    image: n8nio/n8n:latest
    container_name: axiomengine-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=host.docker.internal
      - DB_POSTGRESDB_PORT=5433
      - DB_POSTGRESDB_DATABASE=axiomengine
      - DB_POSTGRESDB_USER=axiomengine
      - DB_POSTGRESDB_PASSWORD=axiomengine_local_dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./n8n_data:/home/node/.n8n
