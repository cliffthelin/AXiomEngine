<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXiomEngine | Command & Control v1.5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #010409;
            --panel-bg: #0d1117;
            --accent-color: #79c0ff;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --success-color: #3fb950;
            --danger-color: #f85149;
            --warning-color: #d29922;
            --glass: rgba(13, 17, 23, 0.8);
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Outfit', sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header { 
            padding: 15px 20px; 
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.2rem; font-weight: 600; color: var(--accent-color); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success-color); display: inline-block; margin-right: 8px; }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            overflow: hidden;
        }

        @media (max-width: 1200px) {
            main { grid-template-columns: 1fr; }
            .sidebar-left, .sidebar-right { display: none; }
        }

        /* Sidebar: Resource Monitor & File Tree */
        .sidebar-left {
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-right {
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8b949e; margin-bottom: 15px; font-weight: 600; }

        .gpu-card { 
            background: #161b22; 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border-color);
        }
        .gpu-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; color: white; }
        .gauge-container { margin-bottom: 10px; }
        .gauge-label { font-size: 0.7rem; color: #8b949e; display: flex; justify-content: space-between; margin-bottom: 4px; }
        .gauge-bar { height: 6px; background: #30363d; border-radius: 3px; overflow: hidden; }
        .gauge-fill { height: 100%; background: var(--accent-color); transition: width 0.5s ease; }
        .gauge-fill.warning { background: var(--warning-color); }
        .gauge-fill.danger { background: var(--danger-color); }

        /* Console: Chat Experience */
        .console {
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        .feed {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; position: relative; }
        .msg-system { background: #161b22; align-self: flex-start; border: 1px solid var(--border-color); color: #c9d1d9; }
        .msg-user { background: rgba(121, 192, 255, 0.1); align-self: flex-end; border: 1px solid var(--accent-color); color: var(--accent-color); }
        .msg-time { font-size: 0.6rem; color: #8b949e; margin-top: 5px; display: block; }
        .msg-log { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #8b949e; white-space: pre-wrap; margin-top: 10px; background: #010409; padding: 10px; border-radius: 6px; }

        .input-area {
            padding: 20px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            color: white;
            font-family: inherit;
            outline: none;
        }
        input:focus { border-color: var(--accent-color); }

        button {
            background: var(--accent-color);
            color: #010409;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
        .badge-success { background: var(--success-color); color: white; }
        .badge-warning { background: var(--warning-color); color: black; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>AXiomEngine C2 <span id="profile-badge" class="badge badge-warning">Standard</span></h1>
    </div>
    <div style="font-size: 0.85rem; color: #8b949e;">
        <span class="status-dot"></span> <span id="server-status">Discovery Online</span>
    </div>
</header>

<main>
    <aside class="sidebar-left">
        <div class="section-title">Hardware Governance</div>
        <div id="gpu-container"></div>

        <div class="section-title" style="margin-top: 20px;">Discovery Registry</div>
        <div id="provider-list" style="font-size: 0.85rem;"></div>
        
        <div class="section-title" style="margin-top: 25px;">Project Artifacts</div>
        <div id="file-tree" style="font-size: 0.8rem; overflow-y: auto; flex: 1;">
            <div style="opacity: 0.5; font-style: italic;">Discovering files...</div>
        </div>
    </aside>

    <section class="console">
        <div id="feed" class="feed">
            <div class="msg msg-system">
                <strong>AXiomEngine C2 v1.6.0 Online.</strong><br>
                Select an artifact from the list or use a preset to begin a mission.
                <span class="msg-time">System initialized</span>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="cmd-input" placeholder="Enter target or click a file..." autocomplete="off">
            <button id="send-btn">AUDIT</button>
        </div>
    </section>

    <aside class="sidebar-right">
        <div class="section-title">Mission Presets</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="preset-btn" onclick="setGoal('Deep Security Audit')">🛡️ Security Audit</button>
            <button class="preset-btn" onclick="setGoal('Codebase Drift Check')">📉 Drift Analysis</button>
            <button class="preset-btn" onclick="setGoal('Hardware Performance Audit')">⚡ Perf Audit</button>
        </div>

        <div class="section-title" style="margin-top: 30px;">Audit History</div>
        <div id="history-list" style="font-size: 0.75rem; color: #8b949e;">
            <!-- History items here -->
        </div>
    </aside>
</main>

<style>
    .preset-btn {
        background: #161b22;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        padding: 10px;
        text-align: left;
        font-size: 0.8rem;
    }
    .file-item {
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .file-item:hover { background: rgba(255,255,255,0.05); color: var(--accent-color); }
    .file-item.active { color: var(--accent-color); background: rgba(121, 192, 255, 0.1); }
</style>

<script>
    const API_BASE = window.location.origin;
    const feed = document.getElementById('feed');
    const cmdInput = document.getElementById('cmd-input');
    const sendBtn = document.getElementById('send-btn');

    let state = {
        gpus: [],
        providers: {},
        activeProfile: "Standard",
        files: [],
        lastLog: "",
        activeGoal: "Deep Security Audit"
    };

    function setGoal(goal) {
        state.activeGoal = goal;
        addMessage("system", `Mission Preset Loaded: <strong>${goal}</strong>`);
    }

    async function updateResources() {
        try {
            const r = await fetch(`${API_BASE}/api/governance/gpu-status`);
            const data = await r.json();
            state.gpus = data.hardware.gpus;
            state.providers = data.providers;
            state.activeProfile = data.hardware.active_profile || "Standard";
            renderResources();
        } catch (e) {
            document.getElementById('server-status').textContent = "Discovery Offline";
            document.getElementById('server-status').style.color = "var(--danger-color)";
        }
    }

    async function fetchFiles() {
        try {
            const r = await fetch(`${API_BASE}/api/governance/files`);
            const data = await r.json();
            state.files = data.files;
            renderFiles();
        } catch (e) {}
    }

    function renderFiles() {
        const container = document.getElementById('file-tree');
        container.innerHTML = state.files.map(f => `
            <div class="file-item" onclick="selectFile('${f}', this)">
                📄 ${f}
            </div>
        `).join('');
    }

    function selectFile(path, el) {
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        cmdInput.value = path;
    }

    function renderResources() {
        const gpuContainer = document.getElementById('gpu-container');
        const providerList = document.getElementById('provider-list');
        const profileBadge = document.getElementById('profile-badge');

        profileBadge.textContent = state.activeProfile;

        gpuContainer.innerHTML = state.gpus.map(g => `
            <div class="gpu-card">
                <div class="gpu-name">${g.name}</div>
                <div class="gauge-container">
                    <div class="gauge-label"><span>GPU Util</span><span>${g.utilization.gpu_pct}%</span></div>
                    <div class="gauge-bar"><div class="gauge-fill ${g.utilization.gpu_pct > 80 ? 'danger' : ''}" style="width: ${g.utilization.gpu_pct}%"></div></div>
                </div>
                <div class="gauge-container">
                    <div class="gauge-label"><span>VRAM</span><span>${g.memory.used_mib} / ${g.memory.total_mib} MiB</span></div>
                    <div class="gauge-bar"><div class="gauge-fill" style="width: ${(g.memory.used_mib / g.memory.total_mib) * 100}%"></div></div>
                </div>
                <div style="font-size: 0.7rem; color: #8b949e; display: flex; justify-content: space-between;">
                    <span>Power</span><span>${g.power.draw_w.toFixed(1)}W / ${g.power.limit_w}W</span>
                </div>
            </div>
        `).join('');

        providerList.innerHTML = `
            <div style="margin-bottom: 8px; display: flex; justify-content: space-between;">
                <span>Ollama</span>
                <span class="badge ${state.providers.ollama.active ? 'badge-success' : 'badge-danger'}">${state.providers.ollama.active ? 'Active' : 'Offline'}</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span>llama-server</span>
                <span class="badge ${state.providers.llama_server.active ? 'badge-success' : 'badge-danger'}">${state.providers.llama_server.active ? 'Active' : 'Offline'}</span>
            </div>
        `;
    }

    async function pollLogs() {
        try {
            const r = await fetch(`${API_BASE}/api/governance/live-logs`);
            const data = await r.json();
            if (data.logs && data.logs !== state.lastLog) {
                state.lastLog = data.logs;
                updateLiveLog(data.logs);
            }
        } catch (e) {}
    }

    function updateLiveLog(content) {
        const existingLog = document.querySelector('.msg-active-log');
        if (existingLog) {
            existingLog.querySelector('.msg-log').textContent = content;
        } else {
            addMessage("system", "Mission Progress Update:", content);
        }
    }

    function addMessage(sender, text, logContent = "") {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg msg-${sender} ${logContent ? 'msg-active-log' : ''}`;
        msgDiv.innerHTML = `
            ${text}
            ${logContent ? `<div class="msg-log">${logContent}</div>` : ''}
            <span class="msg-time">${new Date().toLocaleTimeString()}</span>
        `;
        feed.appendChild(msgDiv);
        feed.scrollTop = feed.scrollHeight;
    }

    async function dispatchMission() {
        const scope = cmdInput.value.trim();
        if (!scope) return;

        addMessage("user", `Dispatching mission for: <code>${scope}</code>`);
        cmdInput.value = "";
        sendBtn.disabled = true;

        try {
            const r = await fetch(`${API_BASE}/api/governance/dispatch`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    skill: "reversa-audit",
                    scope: scope,
                    goal: `Perform a deep reasoning security audit on ${scope} and report findings.`
                })
            });
            const data = await r.json();
            if (data.status === "DISPATCHED") {
                addMessage("system", "Mission acknowledged. Initializing worker on Tesla P40...");
            } else {
                addMessage("system", `Error: ${data.error || "Failed to dispatch"}`);
            }
        } catch (e) {
            addMessage("system", "Error: Discovery Server unreachable.");
        } finally {
            sendBtn.disabled = false;
        }
    }

    sendBtn.onclick = dispatchMission;
    cmdInput.onkeypress = (e) => { if (e.key === "Enter") dispatchMission(); };

    // Initial load and polling
    setInterval(updateResources, 3000);
    setInterval(pollLogs, 2000);
    updateResources();
    fetchFiles();
</script>
</body>
</html>
